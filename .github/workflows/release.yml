name: App bauen

# Baut die Desktop-App für Mac (Apple-Chip und Intel) und Windows.
# - Von Hand (Actions → „App bauen“ → Run workflow): Zips als Artefakte zum Herunterladen.
# - Bei einem Tag wie v1.0.0: zusätzlich ein GitHub-Release mit den Zips zum Weitergeben an Freunde.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # Änderungen am Paketbau gleich im Pull Request prüfen.
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml', 'backend/src/Urlaubsplanner.Api/Desktop/**']

permissions:
  contents: write

jobs:
  mac:
    name: Mac
    # Auf einem Mac bauen: nur dort lässt sich die App signieren (ohne Signatur startet sie auf Apple-Chips nicht).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: packaging/build-app.sh mac 2>&1 | tee build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -iE "error|fehl|not found|No such" build.log | tail -n 15 | sed 's/^/::error::/' || tail -n 15 build.log | sed 's/^/::error::/'
      - name: Signatur prüfen
        run: |
          app="dist/Urlaubsplanner-Mac/Urlaubsplanner.app"
          codesign --verify --deep --verbose=2 "$app"
          test -x "$app/Contents/MacOS/Urlaubsplanner"
          for arch in arm64 x64; do
            test -x "$app/Contents/MacOS/$arch/Urlaubsplanner.Api"
            test -f "$app/Contents/MacOS/$arch/wwwroot/index.html"
            test -f "$app/Contents/MacOS/$arch/desktop.json"
          done
          file "$app/Contents/MacOS/arm64/Urlaubsplanner.Api" "$app/Contents/MacOS/x64/Urlaubsplanner.Api"
      - name: App kurz starten (Rauchtest)
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/daten" URLAUBSPLANNER_BROWSER=/usr/bin/true Updates__Enabled=false
          dist/Urlaubsplanner-Mac/Urlaubsplanner.app/Contents/MacOS/Urlaubsplanner
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:51770/api/app/info && break; sleep 1; done
          curl -sf http://127.0.0.1:51770/api/app/info | grep -q urlaubsplanner
          curl -sf http://127.0.0.1:51770/ | grep -q '<div id="root">'
          curl -sf -X POST http://127.0.0.1:51770/api/app/closing
          sleep 12
          ! curl -sf http://127.0.0.1:51770/api/app/info
      - name: Echtes Fenster – zweiter Klick holt es nach vorne
        # Nur zur Info (Ergebnis als Hinweis oben im Lauf): Fenster-Verhalten hängt von der Testmaschine ab.
        continue-on-error: true
        run: |
          data="$RUNNER_TEMP/fenster"
          app="$PWD/dist/Urlaubsplanner-Mac/Urlaubsplanner.app"
          api=http://127.0.0.1:51770/api/app
          # Wie ein Klick im Finder (über macOS), mit eigenem Datenordner und ohne Updates.
          start() { open --env URLAUBSPLANNER_DATA="$data" --env Updates__Enabled=false "$app"; }
          start
          for i in $(seq 1 60); do [ "$(curl -sf $api/windows)" = '{"open":1}' ] && break; sleep 1; done
          echo "::notice::Mac nach dem Start: $(curl -sf $api/windows)"
          # Diagnose: Log, Browserprozesse, Bildschirmfoto (als Artefakt)
          tail -n 8 "$data/urlaubsplanner.log" | cut -c1-300 | sed 's/^/::notice::Log: /'
          ps -axww -o pid=,args= | grep -i "chrom" | grep -v grep | grep -v -- "--type=" | cut -c1-300 | sed 's/^/::notice::ps: /'
          screencapture -x "$RUNNER_TEMP/fenster.png" || true
          lsof -nP -iTCP:51770 | cut -c1-200 | head -n 8 | sed 's/^/::notice::lsof: /'
          printf '%s\n' 'import CoreGraphics' \
            'let l = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]' \
            'for w in l { let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]; print(w[kCGWindowOwnerPID as String] ?? 0, w[kCGWindowOwnerName as String] ?? "", "layer", w[kCGWindowLayer as String] ?? 0, b["Width"] ?? 0, "x", b["Height"] ?? 0) }' \
            > "$RUNNER_TEMP/fenster.swift"
          swift "$RUNNER_TEMP/fenster.swift" 2>&1 | head -n 12 | sed 's/^/::notice::win: /'
          start
          sleep 10
          echo "::notice::Mac nach zweitem Klick: $(curl -sf $api/windows) – $(grep 'läuft schon' "$data/urlaubsplanner.log" | tail -n 1 | cut -c21-)"
          pkill -TERM -f "Urlaubsplanner.app/Contents/MacOS/.*/Urlaubsplanner.Api" || true
          sleep 8
          if pgrep -f "user-data-dir=$data/fenster" >/dev/null; then
            echo "::warning::Mac: Browser läuft nach dem Beenden noch"
          else
            echo "::notice::Mac: Browser nach dem Beenden geschlossen"
          fi
          tail -n 4 "$data/urlaubsplanner.log" | cut -c1-300 | sed 's/^/::notice::Log Ende: /'
      - name: Diagnose – Chrome direkt starten (vorübergehend)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cd "$RUNNER_TEMP"; mkdir -p web && echo hallo > web/index.html
          (cd web && nohup python3 -m http.server 8765 >"$RUNNER_TEMP/http.log" 2>&1 </dev/null &)
          sleep 2
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$chrome" --app=http://127.0.0.1:8765/?direkt --user-data-dir="$RUNNER_TEMP/p1" --no-first-run --no-default-browser-check >"$RUNNER_TEMP/c1.log" 2>&1 </dev/null &
          echo "::notice::Schritt 1 gestartet"
          sleep 25
          echo "::notice::direkt: $(grep -c direkt "$RUNNER_TEMP/http.log") Anfragen; $(tail -n 3 "$RUNNER_TEMP/c1.log" | tr '\n' ' ' | cut -c1-400)"
          open -na "Google Chrome" --args --app=http://127.0.0.1:8765/?open --user-data-dir="$RUNNER_TEMP/p2" --no-first-run --no-default-browser-check
          sleep 25
          echo "::notice::open -na: $(grep -c open "$RUNNER_TEMP/http.log") Anfragen"
          head -c 600 "$RUNNER_TEMP/http.log" | tr '\n' ' ' | sed 's/^/::notice::http: /'; echo
          swift "$RUNNER_TEMP/fenster.swift" 2>&1 | grep -i chrom | head -n 5 | sed 's/^/::notice::win: /'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fenster-mac
          path: ${{ runner.temp }}/fenster.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Urlaubsplanner-mac
          path: dist/*.zip

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: packaging/build-app.sh windows 2>&1 | tee build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -iE "error|fehl|not found|No such" build.log | tail -n 15 | sed 's/^/::error::/' || tail -n 15 build.log | sed 's/^/::error::/'
      - name: Paket prüfen
        run: |
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/wwwroot/index.html
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/desktop.json
      - name: App kurz starten (Rauchtest)
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/daten" URLAUBSPLANNER_BROWSER='C:\Windows\System32\where.exe' Updates__Enabled=false
          ./dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:51770/api/app/info && break; sleep 1; done
          curl -sf http://127.0.0.1:51770/api/app/info | grep -q urlaubsplanner
          curl -sf http://127.0.0.1:51770/ | grep -q '<div id="root">'
          curl -sf -X POST http://127.0.0.1:51770/api/app/closing
          sleep 12
          ! curl -sf http://127.0.0.1:51770/api/app/info
      - name: Echtes Fenster – zweiter Klick holt es nach vorne
        # Nur zur Info: auf der Testmaschine darf ein per Skript gestartetes Programm evtl. kein Fenster nach vorne holen.
        continue-on-error: true
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/fenster" Updates__Enabled=false
          exe=./dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe
          api=http://127.0.0.1:51770/api/app
          $exe &
          for i in $(seq 1 60); do [ "$(curl -sf $api/windows)" = '{"open":1}' ] && break; sleep 1; done
          echo "::notice::Windows nach dem Start: $(curl -sf $api/windows)"
          $exe
          sleep 10
          echo "::notice::Windows nach zweitem Klick: $(curl -sf $api/windows) – $(grep 'läuft schon' "$URLAUBSPLANNER_DATA/urlaubsplanner.log" | tail -n 1 | cut -c21-)"
          taskkill //IM Urlaubsplanner.exe //F || true
      - uses: actions/upload-artifact@v4
        with:
          name: Urlaubsplanner-windows
          path: dist/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release mit den Zips anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Urlaubsplanner ${GITHUB_REF_NAME}" \
            --notes-file packaging/ANLEITUNG.md
