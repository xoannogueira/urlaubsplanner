name: App bauen

# Baut die Desktop-App für Mac (Apple-Chip und Intel) und Windows.
# - Von Hand (Actions → „App bauen“ → Run workflow): Zips als Artefakte zum Herunterladen.
# - Bei einem Tag wie v1.0.0: zusätzlich ein GitHub-Release mit den Zips zum Weitergeben an Freunde.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # Änderungen am Paketbau gleich im Pull Request prüfen.
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml', 'backend/src/Urlaubsplanner.Api/Desktop/**']

permissions:
  contents: write

jobs:
  mac:
    name: Mac
    # Auf einem Mac bauen: nur dort lässt sich die App signieren (ohne Signatur startet sie auf Apple-Chips nicht).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: dmgbuild installieren (Installationsfenster mit Pfeil)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild pyobjc-framework-Quartz
          echo "$RUNNER_TEMP/dmg/bin" >> "$GITHUB_PATH"
      - run: packaging/build-app.sh mac 2>&1 | tee build.log
        env:
          # Kostenlose Richtpreise (Aviasales) – Token kommt aus den Repo-Secrets, steht nie im Code.
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: Fehler anzeigen
        if: failure()
        run: grep -iE "error|fehl|not found|No such" build.log | tail -n 15 | sed 's/^/::error::/' || tail -n 15 build.log | sed 's/^/::error::/'
      - name: Signatur prüfen
        run: |
          app="dist/Urlaubsplanner-Mac/Urlaubsplanner.app"
          codesign --verify --deep --verbose=2 "$app"
          test -x "$app/Contents/MacOS/Urlaubsplanner"
          for arch in arm64 x64; do
            test -x "$app/Contents/MacOS/$arch/Urlaubsplanner.Api"
            test -f "$app/Contents/MacOS/$arch/wwwroot/index.html"
            test -f "$app/Contents/MacOS/$arch/desktop.json"
          done
          file "$app/Contents/MacOS/arm64/Urlaubsplanner.Api" "$app/Contents/MacOS/x64/Urlaubsplanner.Api"
      - name: App kurz starten (Rauchtest)
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/daten" URLAUBSPLANNER_BROWSER=/usr/bin/true Updates__Enabled=false
          dist/Urlaubsplanner-Mac/Urlaubsplanner.app/Contents/MacOS/Urlaubsplanner
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:51770/api/app/info && break; sleep 1; done
          curl -sf http://127.0.0.1:51770/api/app/info | grep -q urlaubsplanner
          curl -sf http://127.0.0.1:51770/ | grep -q '<div id="root">'
          # Startprüfung der kostenlosen Preisquelle (zeigt nur den Stand, nie den Token)
          sleep 6; echo "::notice::Aviasales: $(curl -s http://127.0.0.1:51770/api/price-source)"
          curl -sf -X POST http://127.0.0.1:51770/api/app/closing
          sleep 12
          ! curl -sf http://127.0.0.1:51770/api/app/info
      - name: Installationsfenster (.dmg) prüfen
        run: |
          hdiutil attach -nobrowse -readonly dist/Urlaubsplanner-Mac.dmg -mountpoint "$RUNNER_TEMP/dmg-inhalt"
          test -x "$RUNNER_TEMP/dmg-inhalt/Urlaubsplanner.app/Contents/MacOS/Urlaubsplanner"
          test "$(readlink "$RUNNER_TEMP/dmg-inhalt/Programme")" = /Applications
          codesign --verify --deep "$RUNNER_TEMP/dmg-inhalt/Urlaubsplanner.app"
          hdiutil detach "$RUNNER_TEMP/dmg-inhalt"
      - name: Dock und Deinstallieren aus der App
        run: |
          apps="$RUNNER_TEMP/Programme"; mkdir -p "$apps"
          cp -R dist/Urlaubsplanner-Mac/Urlaubsplanner.app "$apps/"
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/mac-daten" URLAUBSPLANNER_BROWSER=/usr/bin/true Updates__Enabled=false
          api=http://127.0.0.1:51770/api/app
          "$apps/Urlaubsplanner.app/Contents/MacOS/Urlaubsplanner"
          for i in $(seq 1 30); do curl -sf $api/info >/dev/null && break; sleep 1; done
          status="$(curl -s $api/installation)"; echo "::notice::Mac-Installation: $status"
          echo "$status" | grep -q '"canUninstall":true' || { echo "::error::App kann sich nicht deinstallieren"; tail -n 5 "$URLAUBSPLANNER_DATA/urlaubsplanner.log" | sed 's/^/::error::/'; exit 1; }
          dock="$(curl -s -w ' HTTP %{http_code}' -X POST $api/installation/dock)"; echo "::notice::Dock: $dock"
          sleep 3
          grep -i "dock" "$URLAUBSPLANNER_DATA/urlaubsplanner.log" | cut -c1-250 | sed 's/^/::notice::Log: /' || true
          echo "::notice::Dock läuft: $(pgrep -x Dock || echo nein) · Einträge: $(defaults read com.apple.dock persistent-apps 2>&1 | grep -c '_CFURLString\"' )"
          defaults read com.apple.dock persistent-apps | grep -q "Programme/Urlaubsplanner.app" || { echo "::error::Dock-Eintrag nicht angelegt"; exit 1; }
          echo "::notice::Dock-Eintrag angelegt"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"keepData":false}' $api/installation/uninstall
          sleep 12
          ! curl -sf $api/info
          test ! -e "$apps/Urlaubsplanner.app" || { echo "::error::App wurde nicht entfernt"; exit 1; }
          test ! -e "$URLAUBSPLANNER_DATA" || { echo "::error::Daten wurden nicht entfernt"; exit 1; }
          ! defaults read com.apple.dock persistent-apps 2>/dev/null | grep -q "Programme/Urlaubsplanner.app" || { echo "::error::Dock-Eintrag noch da"; exit 1; }
          echo "::notice::Mac: App, Daten und Dock-Eintrag entfernt"
      # Den Fenstertest gibt es nur unter Windows: Chrome öffnet auf den Mac-Testmaschinen von GitHub gar keine Fenster.
      - uses: actions/upload-artifact@v4
        with:
          name: Urlaubsplanner-mac
          path: |
            dist/*.zip
            dist/*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - run: packaging/build-app.sh windows 2>&1 | tee build.log
        env:
          # Kostenlose Richtpreise (Aviasales) – Token kommt aus den Repo-Secrets, steht nie im Code.
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: Fehler anzeigen
        if: failure()
        run: grep -iE "error|fehl|not found|No such" build.log | tail -n 15 | sed 's/^/::error::/' || tail -n 15 build.log | sed 's/^/::error::/'
      - name: Paket prüfen
        run: |
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/wwwroot/index.html
          test -f dist/Urlaubsplanner-Windows/Urlaubsplanner/desktop.json
          test -f dist/Urlaubsplanner-Setup.exe
      - name: App kurz starten (Rauchtest)
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/daten" URLAUBSPLANNER_BROWSER='C:\Windows\System32\where.exe' Updates__Enabled=false
          ./dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:51770/api/app/info && break; sleep 1; done
          curl -sf http://127.0.0.1:51770/api/app/info | grep -q urlaubsplanner
          curl -sf http://127.0.0.1:51770/ | grep -q '<div id="root">'
          curl -sf -X POST http://127.0.0.1:51770/api/app/closing
          sleep 12
          ! curl -sf http://127.0.0.1:51770/api/app/info
      - name: Installer, Deinstaller und Deinstallieren aus der App
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Urlaubsplanner'
          $data = Join-Path $env:LOCALAPPDATA 'Urlaubsplanner'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Urlaubsplanner.lnk'
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'Urlaubsplanner.lnk'
          function Install { Start-Process dist\Urlaubsplanner-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait }
          function Check($ok, $message) { if (-not $ok) { Write-Output "::error::$message"; exit 1 } }

          # 1. Installieren: App, Deinstaller, Startmenü und Desktop
          Install
          Check (Test-Path "$app\Urlaubsplanner.exe") 'App nicht installiert'
          Check (Test-Path "$app\unins000.exe") 'Deinstaller fehlt'
          Check (Test-Path $desktop) 'Desktop-Verknüpfung fehlt'
          Check (Test-Path $start) 'Startmenü-Eintrag fehlt'

          # 2. Deinstaller ohne /DELETEDATA: alles weg, Reisen bleiben
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'trips.json') '{"trips":[]}'
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 5
          Check (-not (Test-Path "$app\Urlaubsplanner.exe")) 'App nach dem Deinstallieren noch da'
          Check (-not (Test-Path $desktop)) 'Desktop-Verknüpfung noch da'
          Check (Test-Path (Join-Path $data 'trips.json')) 'Reisen wurden ohne Nachfrage gelöscht'

          # 3. Wieder installieren und aus der App heraus komplett entfernen
          Install
          $env:URLAUBSPLANNER_BROWSER = 'C:\Windows\System32\where.exe'
          $env:Updates__Enabled = 'false'
          Start-Process "$app\Urlaubsplanner.exe"
          $api = 'http://127.0.0.1:51770/api/app'
          for ($i = 0; $i -lt 40; $i++) { try { Invoke-RestMethod "$api/info" | Out-Null; break } catch { Start-Sleep 1 } }
          $status = Invoke-RestMethod "$api/installation"
          Write-Output "Installation: $($status | ConvertTo-Json -Compress)"
          Check ($status.canUninstall -and $status.installer) 'App erkennt den Installer nicht'
          Invoke-RestMethod -Method Post "$api/installation/uninstall" -ContentType 'application/json' -Body '{"keepData":false}'
          for ($i = 0; $i -lt 45 -and ((Test-Path $app) -or (Test-Path $data)); $i++) { Start-Sleep 1 }
          Check (-not (Test-Path "$app\Urlaubsplanner.exe")) 'App nach Deinstallieren aus der App noch da'
          Check (-not (Test-Path $data)) 'Daten nach Deinstallieren aus der App noch da'
          Check (-not (Test-Path $desktop)) 'Desktop-Verknüpfung nach Deinstallieren aus der App noch da'
      - name: Echtes Fenster – zweiter Klick holt es nach vorne
        # Nur zur Info: auf der Testmaschine darf ein per Skript gestartetes Programm evtl. kein Fenster nach vorne holen.
        continue-on-error: true
        run: |
          export URLAUBSPLANNER_DATA="$RUNNER_TEMP/fenster" Updates__Enabled=false
          exe=./dist/Urlaubsplanner-Windows/Urlaubsplanner/Urlaubsplanner.exe
          api=http://127.0.0.1:51770/api/app
          $exe &
          for i in $(seq 1 60); do [ "$(curl -sf $api/windows)" = '{"open":1}' ] && break; sleep 1; done
          echo "::notice::Windows nach dem Start: $(curl -sf $api/windows)"
          $exe
          sleep 10
          echo "::notice::Windows nach zweitem Klick: $(curl -sf $api/windows) – $(grep 'läuft schon' "$URLAUBSPLANNER_DATA/urlaubsplanner.log" | tail -n 1 | cut -c21-)"
          taskkill //IM Urlaubsplanner.exe //F || true
      - uses: actions/upload-artifact@v4
        with:
          name: Urlaubsplanner-windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release mit den Zips anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg dist/*.exe \
            --title "Urlaubsplanner ${GITHUB_REF_NAME}" \
            --notes-file packaging/ANLEITUNG.md
